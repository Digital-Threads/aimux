<svg xmlns="http://www.w3.org/2000/svg" width="918" height="267" viewBox="0 0 918 267" role="img" aria-label="Inside Claude Code: aimux shows every subscription's 5-hour and weekly usage above the prompt, this session's first, and warns before it runs out">
  <rect width="100%" height="100%" rx="10" fill="#0d1117"/>
  <circle cx="20" cy="18" r="5.5" fill="#f85149"/><circle cx="38" cy="18" r="5.5" fill="#d29922"/><circle cx="56" cy="18" r="5.5" fill="#3fb950"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="13">
  <text x="22" y="46"><tspan fill="#3fb950" xml:space="preserve">● </tspan><tspan fill="#c9d1d9" xml:space="preserve">Done — the migration is applied and the tests pass.</tspan></text>
  <text x="22" y="65"></text>
  <text x="22" y="84"><tspan fill="#58a6ff" xml:space="preserve">  ┌ aimux </tspan><tspan fill="#30363d" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="103"><tspan fill="#30363d" xml:space="preserve">  │ </tspan><tspan fill="#c9d1d9" xml:space="preserve">work has used 92% of its 5-hour window (resets in 40m). Freest now: client (5h 4%, 7d 1%).</tspan></text>
  <text x="22" y="122"><tspan fill="#30363d" xml:space="preserve">  │ </tspan><tspan fill="#c9d1d9" xml:space="preserve">When this one runs out, aimux will offer to move this conversation there.</tspan></text>
  <text x="22" y="141"><tspan fill="#30363d" xml:space="preserve">  └────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="160"></text>
  <text x="22" y="179"><tspan fill="#8b949e" xml:space="preserve">aimux  </tspan><tspan fill="#e6edf3" font-weight="bold" xml:space="preserve">▸ work </tspan><tspan fill="#8b949e" xml:space="preserve">(this session) </tspan><tspan fill="#8b949e" xml:space="preserve">5h:</tspan><tspan fill="#f85149" xml:space="preserve">92%</tspan><tspan fill="#8b949e" xml:space="preserve"> (resets in 40m)</tspan><tspan fill="#8b949e" xml:space="preserve"> </tspan><tspan fill="#8b949e" xml:space="preserve">7d:</tspan><tspan fill="#3fb950" xml:space="preserve">41%</tspan><tspan fill="#8b949e" xml:space="preserve">  │  </tspan><tspan fill="#c9d1d9" xml:space="preserve">personal </tspan><tspan fill="#8b949e" xml:space="preserve">5h:</tspan><tspan fill="#3fb950" xml:space="preserve">13%</tspan><tspan fill="#8b949e" xml:space="preserve"> </tspan><tspan fill="#8b949e" xml:space="preserve">7d:</tspan><tspan fill="#3fb950" xml:space="preserve">12%</tspan><tspan fill="#8b949e" xml:space="preserve"> · </tspan><tspan fill="#c9d1d9" xml:space="preserve">client </tspan><tspan fill="#8b949e" xml:space="preserve">5h:</tspan><tspan fill="#3fb950" xml:space="preserve">4%</tspan><tspan fill="#8b949e" xml:space="preserve"> </tspan><tspan fill="#8b949e" xml:space="preserve">7d:</tspan><tspan fill="#3fb950" xml:space="preserve">1%</tspan><tspan fill="#8b949e" xml:space="preserve"> · </tspan><tspan fill="#c9d1d9" xml:space="preserve">codex </tspan><tspan fill="#8b949e" xml:space="preserve">7d:</tspan><tspan fill="#3fb950" xml:space="preserve">31%</tspan></text>
  <text x="22" y="198"><tspan fill="#30363d" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
  <text x="22" y="217"><tspan fill="#e6edf3" xml:space="preserve">❯ </tspan><tspan fill="#c9d1d9" xml:space="preserve"></tspan></text>
  <text x="22" y="236"><tspan fill="#30363d" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
