<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="aimux-key" content="">
<title>aimux dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a19'/%3E%3Crect x='7' y='14' width='4' height='11' rx='2' fill='%230ca30c'/%3E%3Crect x='14' y='9' width='4' height='16' rx='2' fill='%23fab219'/%3E%3Crect x='21' y='6' width='4' height='19' rx='2' fill='%23ec835a'/%3E%3C/svg%3E">
<script>
  // Before the first paint, so the page never flashes the other theme: the reader's choice, else the system's.
  try {
    document.documentElement.dataset.theme = localStorage.getItem('aimux.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<style>
  /* A mixing desk at night: every subscription is a channel strip with its level meters.
     Colour belongs to the data alone; the chrome is ink, hairlines and one soft light. */
  @font-face { font-family: 'Geist'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(fonts/geist-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Geist'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(fonts/geist-cyrillic-wght-normal.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Geist Mono'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(fonts/geist-mono-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Geist Mono'; font-style: normal; font-display: swap; font-weight: 100 900; src: url(fonts/geist-mono-cyrillic-wght-normal.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

  :root {
    color-scheme: light;
    --plane: #f5f4f0;
    --glow: rgba(255, 255, 255, 0.95);
    --dots: rgba(11, 11, 11, 0.05);
    --surface: #fcfcfb;
    --inset: #efeee9;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #807e78;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --edge: rgba(11, 11, 11, 0.10);
    --edge-hi: rgba(255, 255, 255, 0.9);
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.05), 0 16px 36px -20px rgba(11, 11, 11, 0.25);
    --wash: rgba(11, 11, 11, 0.05);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #6250d6;
    --series-8: #e34948;
    --series-rest: #898781;
    --series-other: #c3c2b7;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0b0b0a;
    --glow: rgba(255, 255, 255, 0.06);
    --dots: rgba(255, 255, 255, 0.045);
    --surface: #1a1a19;
    --inset: #111110;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #8f8d86;
    --grid: #2c2c2a;
    --axis: #383835;
    --edge: rgba(255, 255, 255, 0.09);
    --edge-hi: rgba(255, 255, 255, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 20px 44px -22px rgba(0, 0, 0, 0.85);
    --wash: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
    --series-other: #5f5e58;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  /* The room: one light from the upper left over a faint grid. Behind everything, never in the way. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1100px 560px at 10% -10%, var(--glow), transparent 62%),
      radial-gradient(circle at 1px 1px, var(--dots) 1px, transparent 0) 0 0 / 22px 22px;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }
  p { margin: 0; }
  .grow { flex: 1; }
  /* Labels in the mono face. Its word space is a whole letter wide, so it is drawn in. */
  .eyebrow, .card h3, .wlabel, .badge, .spark .cap, .filters legend, th, #tip .t { word-spacing: -0.3em; }
  .eyebrow { font: 500 11px/1.3 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }

  /* ---- the bar: stays in reach while the page scrolls ---- */
  .bar {
    position: sticky; top: 0; z-index: 5; margin: 0 -20px; padding: 12px 20px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    font: 12.5px var(--mono); border-bottom: 1px solid var(--edge);
    background: color-mix(in srgb, var(--plane) 80%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .brand { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; }
  .brand span { color: var(--muted); font-weight: 400; }
  .stamp { color: var(--muted); margin-right: 4px; font: 12.5px var(--sans); }
  @media (max-width: 640px) { .stamp { order: 9; flex-basis: 100%; margin: 0; } }
  button, .seg label {
    font: 500 12.5px var(--mono); color: var(--ink); background: var(--surface);
    border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    transition: background-color 0.15s ease-out, opacity 0.15s ease-out;
  }
  button:hover, .seg label:hover { background: var(--inset); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.icon { padding: 6px 8px; display: inline-flex; }
  button.icon svg { width: 16px; height: 16px; }
  button.mini { padding: 4px 9px; font-size: 11.5px; }
  /* The button shows where it takes you: the sun while it is dark. */
  :root[data-theme="dark"] .moon, :root:not([data-theme="dark"]) .sun { display: none; }
  button:focus-visible, .seg input:focus-visible + label, [tabindex]:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .seg { display: inline-flex; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { border-radius: 0; margin-left: -1px; white-space: nowrap; }
  .seg label:first-of-type { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg label:last-of-type { border-radius: 0 8px 8px 0; }
  .seg input:checked + label { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  @media (max-width: 420px) { .seg label { padding: 6px 8px; } }

  /* ---- the lead: one sentence, then three readouts ---- */
  .hero { padding: clamp(28px, 5.5vw, 56px) 0 0; }
  .hero h1 {
    margin: 14px 0 14px; max-width: 20ch;
    font-size: clamp(32px, 5vw, 60px); line-height: 1.02; letter-spacing: -0.04em; font-weight: 600;
    text-wrap: balance; overflow-wrap: anywhere;
  }
  .lead { font-size: clamp(15px, 1.5vw, 18px); line-height: 1.5; color: var(--ink-2); max-width: 66ch; text-wrap: pretty; min-height: 1.5em; }
  .who { white-space: nowrap; }
  .who .dot { width: 0.3em; height: 0.3em; min-width: 7px; min-height: 7px; margin-right: 0.2em; vertical-align: 0.16em; }

  .readouts {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 1px;
    margin-top: clamp(22px, 3.4vw, 36px); border-radius: 14px; overflow: hidden;
    background: var(--edge); border: 1px solid var(--edge); box-shadow: var(--shadow);
  }
  .readout { background: var(--surface); padding: 16px 18px 17px; box-shadow: inset 0 1px 0 var(--edge-hi); }
  .readout .value { font-size: 25px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.2; margin-top: 8px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .readout .sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }

  /* ---- channel strips ---- */
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--edge); border-radius: 14px; padding: 18px;
    box-shadow: inset 0 1px 0 var(--edge-hi), var(--shadow);
  }
  .card h3 { margin: 0 0 14px; font: 500 11px/1.3 var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .subs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 14px; margin-top: 14px; }
  .strip { padding-left: 24px; }
  /* The strip's colour: the subscription's own, the same in every chart and table below. */
  .strip::before { content: ''; position: absolute; left: -1px; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--id); }
  .sub-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .sub-head .name { font-weight: 600; font-size: 17px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .cli { font: 11px var(--mono); color: var(--muted); border: 1px solid var(--edge); border-radius: 999px; padding: 1px 7px 2px; white-space: nowrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    font: 500 11px/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
    padding: 5px 9px 5px 7px; border-radius: 999px; background: color-mix(in srgb, var(--tone) 15%, transparent);
  }
  .badge svg { width: 13px; height: 13px; flex: none; color: var(--tone); }
  .win { display: grid; grid-template-columns: 68px 1fr auto; align-items: center; column-gap: 12px; margin-top: 16px; }
  .wlabel { font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .pct { min-width: 3.2ch; text-align: right; font-size: 21px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 1px; letter-spacing: 0; }
  .note { grid-column: 2 / 4; color: var(--ink-2); font-size: 12.5px; line-height: 1.45; margin-top: 6px; }
  .meter { position: relative; height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--tone) 18%, var(--inset)); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16); }
  .meter .fill { height: 100%; border-radius: 6px; background: var(--tone); min-width: 3px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28); }
  /* The clock: how much of the window's time has gone. Ringed in the surface so it reads over the level. */
  .meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; box-shadow: 0 0 0 1.5px var(--surface); }
  .tone-ok { --tone: var(--good); }
  .tone-tight { --tone: var(--warning); }
  .tone-over { --tone: var(--serious); }
  .tone-spent { --tone: var(--critical); }
  .tone-unknown { --tone: var(--muted); }
  .problem { color: var(--ink-2); font-size: 13px; margin-top: 12px; }
  .cmd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .cmd code { background: var(--inset); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 8px; color: var(--ink); }
  .spark { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--grid); }
  .spark .cap { font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .spark .plot { position: relative; }
  .spark svg { display: block; width: 100%; height: 40px; }
  .spark .end { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid var(--surface); }
  .legend-note { color: var(--ink-2); font-size: 13px; margin-top: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .tickkey { width: 2px; height: 14px; margin-top: 3px; background: var(--ink); border-radius: 1px; display: inline-block; flex: none; }

  /* ---- usage ---- */
  .section-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin-top: clamp(56px, 8vw, 96px); }
  h2 { margin: 10px 0 6px; font-size: clamp(23px, 2.8vw, 32px); line-height: 1.1; letter-spacing: -0.035em; font-weight: 600; }
  .lede { color: var(--ink-2); max-width: 58ch; text-wrap: pretty; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .filters fieldset { border: 0; padding: 0; margin: 0; display: flex; align-items: center; gap: 8px; }
  .filters legend { float: left; padding: 0; margin-right: 8px; font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .stale { opacity: 0.55; transition: opacity 0.2s ease-out; }
  .status { font: 12px var(--mono); color: var(--muted); min-height: 18px; margin-top: 14px; }
  .status.bad { color: var(--ink); }
  /* minmax(0, …): a wide table scrolls inside its card instead of widening the page. */
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 6px; }
  .stack .readouts { margin-top: 0; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 14px; }
  .two > .card { min-width: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 10px; color: var(--ink-2); font-size: 13px; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--muted); font: 10.5px var(--mono); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 8px 10px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid); }
  th { font: 500 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  th:first-child, td:first-child, td.text, th.text { text-align: left; }
  tbody tr:hover { background: var(--wash); }
  tfoot td { font-weight: 600; border-bottom: 0; }
  td .dot { margin-right: 9px; vertical-align: baseline; }

  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 10px; align-items: center; border-radius: 6px; padding: 2px 4px; margin: 0 -4px; }
  .bar-row:hover, .bar-row:focus-visible { background: var(--wash); }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 13px; }
  .bar-row .track { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar-row .rod { height: 10px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; flex: none; }
  .bar-row .val { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--surface); color: var(--ink); border: 1px solid var(--edge); border-radius: 10px;
    box-shadow: inset 0 1px 0 var(--edge-hi), 0 10px 30px rgba(0, 0, 0, 0.28); padding: 9px 11px; font-size: 12.5px; max-width: 320px;
  }
  #tip .t { font: 11px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; overflow-wrap: anywhere; }
  #tip .r { display: flex; align-items: center; gap: 8px; }
  #tip .r b { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  #tip .r span.n { color: var(--ink-2); }
  #tip .k { width: 10px; height: 2px; border-radius: 1px; flex: none; }
  footer { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--edge); color: var(--ink-2); font-size: 13px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px 40px; }
  footer b { color: var(--ink); font-weight: 600; }
  code { font: 12.5px var(--mono); }
  .problem code, footer code { background: var(--inset); border-radius: 5px; padding: 1px 5px; }

  /* ---- motion: the desk powers on ----
     Levels rise once when the page opens or is refreshed, never on the quiet minute-by-minute
     re-read. Each keyframe names only where a thing comes from, so without motion it is
     simply where it belongs. */
  @keyframes arrive { from { opacity: 0; transform: translateY(10px); } }
  @keyframes rise { from { width: 0; } }
  @keyframes sweep { from { left: 0; opacity: 0; } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes attention { 50% { opacity: 0.35; } }
  .power-on .strip { animation: arrive 0.5s cubic-bezier(0.2, 0.75, 0.2, 1) both; animation-delay: calc(var(--n, 0) * 55ms); }
  .power-on .fill { animation: rise 0.9s cubic-bezier(0.2, 0.75, 0.2, 1) both; animation-delay: calc(var(--n, 0) * 55ms + 120ms); }
  .power-on .tick { animation: sweep 0.9s cubic-bezier(0.2, 0.75, 0.2, 1) both; animation-delay: calc(var(--n, 0) * 55ms + 220ms); }
  .cols.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 0.55s cubic-bezier(0.2, 0.75, 0.2, 1) both; }
  /* Only what needs attention moves on its own, and slower than reading. */
  .badge.tone-over svg, .badge.tone-spent svg { animation: attention 2.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="bar">
    <span class="brand">aimux<span> / dashboard</span></span>
    <span class="grow"></span>
    <span class="stamp" id="stamp" aria-live="polite"></span>
    <span class="seg" id="lang" role="radiogroup" aria-label="Language"></span>
    <button class="icon" id="theme" type="button">
      <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></g></svg>
      <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <button id="refresh" type="button" data-t="refresh"></button>
  </header>

  <section class="hero" aria-labelledby="headline">
    <div class="eyebrow" data-t="limitsNow"></div>
    <h1 id="headline" data-t="reading"></h1>
    <p class="lead" id="lead"></p>
    <div class="readouts" id="limit-tiles" hidden></div>
    <div class="status" id="limits-status"></div>
    <div class="subs" id="subs"></div>
    <div class="legend-note" id="limits-key" hidden>
      <span class="tickkey"></span>
      <span data-t="tickKey"></span>
    </div>
  </section>

  <section aria-labelledby="h-usage">
    <div class="section-head">
      <div>
        <div class="eyebrow" data-t="usage"></div>
        <h2 id="h-usage" data-t="usageTitle"></h2>
        <p class="lede" data-t="usageLede"></p>
      </div>
      <div class="filters">
        <fieldset>
          <legend data-t="period"></legend>
          <span class="seg" id="since"></span>
        </fieldset>
        <fieldset>
          <legend data-t="measure"></legend>
          <span class="seg" id="measure"></span>
        </fieldset>
      </div>
    </div>
    <div class="status" id="usage-status" data-t="scanning"></div>
    <div class="stack" id="usage" hidden>
      <div class="readouts" id="usage-tiles"></div>
      <div class="card">
        <h3 id="time-title"></h3>
        <div class="legend" id="time-legend"></div>
        <div class="chart" id="time-chart"></div>

/** An element with attributes and children. Strings become text nodes: names here come from disk. */
function el(tag, attrs, ...children) {
  const node = attrs?.svg ? document.createElementNS(SVG, tag) : document.createElement(tag);
  for (const [key, value] of Object.entries(attrs ?? {})) {
    if (key === 'svg' || value === undefined || value === null || value === false) continue;
    if (key === 'class') node.setAttribute('class', value);
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

/** `**bold**`, `_italic_` and `` `code` `` in the page's own notes, as nodes. */
function rich(text) {
  return text.split(/(\*\*[^*]+\*\*|_[^_]+_|`[^`]+`)/).map((part) => {
    if (part.startsWith('**')) return el('b', { text: part.slice(2, -2) });
    if (part.startsWith('_') && part.endsWith('_') && part.length > 2) return el('i', { text: part.slice(1, -1) });
    if (part.startsWith('`')) return el('code', { text: part.slice(1, -1) });
    return part;
  });
}

// ---------- numbers ----------
const num = (n, digits = 0) => n.toLocaleString(L.locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
function compact(n) {
  const abs = Math.abs(n);
  if (abs >= 1e9) return `${num(n / 1e9, abs >= 1e10 ? 0 : 1)}${L.units[2]}`;
  if (abs >= 1e6) return `${num(n / 1e6, abs >= 1e7 ? 0 : 1)}${L.units[1]}`;
  if (abs >= 1e3) return `${num(n / 1e3, abs >= 1e4 ? 0 : 1)}${L.units[0]}`;
  return num(Math.round(n));
}
const whole = (n) => num(Math.round(n));
const usd = (n) => `$${n >= 100 ? num(n) : num(n, 2)}`;
const tokensOf = (x) => x.inputTokens + x.cacheCreationInputTokens + x.cacheReadInputTokens + x.outputTokens;

/** An axis value in full — 12.5K, 0.25 — never rounded into its neighbour. */

  const [unit, suffix] = n >= 1e9 ? [1e9, L.units[2]] : n >= 1e6 ? [1e6, L.units[1]] : n >= 1e3 ? [1e3, L.units[0]] : [1, ''];
  return `${(n / unit).toLocaleString(L.locale, { maximumFractionDigits: 2 })}${suffix}`;
}

// ---------- identity: a profile keeps its colour whatever is on screen ----------
const UNTIED = '\u0000untied';
const OTHERS = '\u0000others';
const isUnknown = (name) => name.startsWith('unknown');
let order = [];

/** The series a profile is drawn in: its own, or one of the two shared grey ones. */
function seriesOf(name) {
  if (isUnknown(name)) return UNTIED;
  return order.indexOf(name) < 8 && order.includes(name) ? name : OTHERS;
}
const seriesName = (series) => (series === UNTIED ? L.untied : series === OTHERS ? L.others : series);
/** One colour per series, the same in the chart, the cards and the tables. */
function colorOf(name) {
  const series = seriesOf(name);
  if (series === UNTIED) return 'var(--series-rest)';
  return series === OTHERS ? 'var(--series-other)' : `var(--series-${order.indexOf(series) + 1})`;
}
const paint = (series) => (series === OTHERS ? 'var(--series-other)' : series === UNTIED ? 'var(--series-rest)' : colorOf(series));

// ---------- tooltip ----------
const tip = $('tip');
function showTip(x, y, title, rows) {
  tip.replaceChildren(
    el('div', { class: 't', text: title }),
    ...rows.map(([value, name, color]) =>
      el('div', { class: 'r' }, color && el('span', { class: 'k', style: `background:${color}` }), el('b', { text: value }), el('span', { class: 'n', text: name }))),
  );
  // Measured in the corner, where it has the whole width to lay itself out in.
  tip.style.left = tip.style.top = '0px';
  tip.style.display = 'block';

  const box = tip.getBoundingClientRect();
  const left = x + 14 + box.width > innerWidth - 4 ? x - 14 - box.width : x + 14;
  tip.style.left = `${Math.max(4, Math.min(left, innerWidth - box.width - 4))}px`;
  tip.style.top = `${Math.max(4, Math.min(y + 14, innerHeight - box.height - 4))}px`;
}
const hideTip = () => { tip.style.display = 'none'; };
/** Hover and keyboard focus show the same thing. */
function withTip(node, read) {
  node.addEventListener('pointermove', (e) => showTip(e.clientX, e.clientY, ...read()));
  node.addEventListener('pointerleave', hideTip);
  node.addEventListener('focus', () => {
    const box = node.getBoundingClientRect();
    showTip(box.left + box.width / 2, box.bottom, ...read());
  });
  node.addEventListener('blur', hideTip);
  return node;
}

// ---------- time ----------
const formats = {};
/** A date format in the page's language, made once per language. */
const fmt = (name, options) => (formats[`${lang}:${name}`] ??= new Intl.DateTimeFormat(L.locale, options));
const clock = (at) => fmt('clock', { hour: '2-digit', minute: '2-digit' }).format(at);
const dayClock = (at) => fmt('dayClock', { weekday: 'short', hour: '2-digit', minute: '2-digit' }).format(at);
const dayMonth = (at) => fmt('dayMonth', { day: 'numeric', month: 'short' }).format(at);
const monthYear = (at) => fmt('monthYear', { month: 'short', year: 'numeric' }).format(at).replace(' г.', '');

function span(ms) {
  const minutes = Math.max(0, Math.round(ms / 60000));
  if (minutes < 60) return `${minutes}${L.span.m}`;

  // The smaller unit only when there is some of it: "7d", not "7d 0h".
  const [big, small, rest] = minutes < 48 * 60
    ? [`${Math.floor(minutes / 60)}${L.span.h}`, `${minutes % 60}${L.span.m}`, minutes % 60]
    : [`${Math.floor(minutes / 1440)}${L.span.d}`, `${Math.floor((minutes % 1440) / 60)}${L.span.h}`, Math.floor((minutes % 1440) / 60)];
  return rest === 0 ? big : `${big} ${small}`;
}
const when = (at, now) => (at - now < 24 * 3600e3 ? L.inSpan(span(at - now)) : dayClock(at));

// ---------- limits ----------
const VERDICT_ICONS = {
  ok: 'M3 8.5l3.2 3.2L13 5',
  tight: 'M8 2.5l6 11H2zM8 7v3M8 12v.5',
  over: 'M3 13l10-10M6 3h7v7',
  spent: 'M4 4l8 8M12 4l-8 8',
  unknown: 'M5 8h6',
};
const WINDOW_MS = { fiveHour: 5 * 3600e3, weekly: 7 * 24 * 3600e3 };

function badge(verdict) {
  return el('span', { class: `badge tone-${verdict}` },
    s('svg', { viewBox: '0 0 16 16', 'aria-hidden': 'true' }, s('path', { d: VERDICT_ICONS[verdict], fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })),
    L.verdicts[verdict]);
}

function windowNote(w, now) {
  const reset = w.resetsAt ? when(w.resetsAt, now) : '';
  if (w.verdict === 'spent') return L.note.full(reset);
  if (w.runsOutAt) return L.note.runsOut(when(w.runsOutAt, now), span(w.resetsAt - w.runsOutAt), reset);
  if (w.projectedPct !== null) return L.note.course(reset, w.projectedPct);
  return reset ? L.note.resets(reset) : L.note.unknown;
}

function windowRow(key, w, now) {
  if (!w) return null;

  const passed = w.resetsAt ? 1 - (w.resetsAt - now) / WINDOW_MS[key] : null;
  return el('div', { class: `win tone-${w.verdict}` },
    el('span', { class: 'wlabel', text: L.winShort[key] }),
    el('div', { class: 'meter', role: 'meter', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': w.pct, 'aria-label': L.meterLabel(L.winShort[key]) },
      el('div', { class: 'fill', style: `width:${Math.min(100, w.pct)}%` }),
      passed !== null && passed > 0 && passed < 1 && el('span', { class: 'tick', style: `left:${passed * 100}%`, title: L.tickTitle(Math.round(passed * 100)) })),
    el('span', { class: 'pct' }, String(w.pct), el('small', { text: '%' })),
    el('span', { class: 'note', text: windowNote(w, now) }));
}

/** A profile's weekly level over the recorded history: the trend behind today's figure. */
function sparkline(name, hasWeekly) {
  const key = hasWeekly ? 'weekly' : 'fiveHour';
  const points = state.history
    .map((reading) => [reading.at, reading.profiles[name]?.[hasWeekly ? 1 : 0]])
    .filter(([, pct]) => typeof pct === 'number');
  if (points.length < 3 || points.at(-1)[0] - points[0][0] < 30 * 60e3) return null;

  const W = 300, H = 40, pad = 5;
  const [t0, t1] = [points[0][0], points.at(-1)[0]];
  const x = (t) => pad + ((t - t0) / (t1 - t0)) * (W - 2 * pad);
  const y = (pct) => H - pad - (Math.min(100, pct) / 100) * (H - 2 * pad);
  const line = points.map(([t, pct], i) => `${i ? 'L' : 'M'}${x(t).toFixed(1)} ${y(pct).toFixed(1)}`).join('');
  const [lastT, lastPct] = points.at(-1);

  const hair = s('line', { y1: 0, y2: H, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden', 'vector-effect': 'non-scaling-stroke' });
  const chart = s('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img', 'aria-label': L.sparkLabel(name, L.windows[key], points[0][1], lastPct, span(t1 - t0)) },
    s('line', { x1: 0, x2: W, y1: H - pad, y2: H - pad, stroke: 'var(--grid)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }),
    hair,
    s('path', { d: line, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' }));
  // The plot stretches to the card; the end dot is laid over it so it stays round.
  const end = el('span', { class: 'end', style: `left:${(x(lastT) / W) * 100}%;top:${(y(lastPct) / H) * 100}%;background:${colorOf(name)}` });

  chart.addEventListener('pointermove', (e) => {
    const box = chart.getBoundingClientRect();
    const t = t0 + ((e.clientX - box.left) / box.width) * (t1 - t0);
    const [at, pct] = points.reduce((best, p) => (Math.abs(p[0] - t) < Math.abs(best[0] - t) ? p : best));
    hair.setAttribute('x1', x(at));
    hair.setAttribute('x2', x(at));
    hair.setAttribute('visibility', 'visible');
    showTip(e.clientX, e.clientY, dayClock(at), [[`${pct}%`, L.sparkTip[key]]]);
  });
  chart.addEventListener('pointerleave', () => { hair.setAttribute('visibility', 'hidden'); hideTip(); });

  return el('div', { class: 'spark' },
    el('div', { class: 'cap', text: L.sparkCap(key, span(t1 - t0)) }),
    el('div', { class: 'plot' }, chart, end));
}

/** A command to run, on a line of its own with a button that puts it on the clipboard. */
function command(text) {
  const button = el('button', { class: 'mini', type: 'button', text: L.copy });
  button.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = L.copied;
      setTimeout(() => { button.textContent = L.copy; }, 1600);
    } catch {
      // no clipboard here: the command is on the page to select
    }
  });

  return el('div', { class: 'cmd' }, el('code', { text }), button);
}

/** One channel strip: the subscription, its verdict, a level meter per window. `n` staggers its arrival. */
function subscriptionCard(p, now, n) {
  const problem =
    p.error === 'auth' ? L.problem.login
    : p.error === 'unavailable' ? L.problem.unavailable
    : !p.fiveHour && !p.weekly ? L.problem.noLimits
    : null;

  return el('div', { class: 'card strip', style: `--id:${colorOf(p.name)};--n:${n}` },
    el('div', { class: 'sub-head' },
      el('span', { class: 'name', text: p.name }),
      el('span', { class: 'cli', text: p.cli }),
      el('span', { class: 'grow' }),
      badge(p.verdict)),
    problem && el('p', { class: 'problem', text: problem }),
    p.error === 'auth' && command(`aimux run ${p.name}`),
    windowRow('fiveHour', p.fiveHour, now),
    windowRow('weekly', p.weekly, now),
    sparkline(p.name, Boolean(p.weekly)));
}

function readout(label, value, sub) {
  return el('div', { class: 'readout' }, el('div', { class: 'eyebrow', text: label }), el('div', { class: 'value' }, value), el('div', { class: 'sub', text: sub }));
}

/** A subscription named in running text, with its colour beside it: the text itself stays ink. */
const who = (name) => el('span', { class: 'who' }, el('span', { class: 'dot', style: `background:${colorOf(name)}` }), name);
const listed = (profiles) => profiles.flatMap((p, i) => [i === 0 ? '' : i === profiles.length - 1 ? L.and : ', ', who(p.name)]);

/**
 * The sentence the page leads with, and what goes under it: who is in trouble and how
 * soon, or that nobody is. `windows` is every window of every subscription.
 */
function leadOf(profiles, windows, now) {
  const judged = profiles.filter((p) => p.verdict !== 'unknown');
  const having = (verdict) => judged.filter((p) => p.verdict === verdict);
  const [spent, over, tight] = [having('spent'), having('over'), having('tight')];
  const locked = profiles.filter((p) => p.error === 'auth');
  const login = locked.length ? L.lead.login(listed(locked), locked.length) : [];

  if (!judged.length) return [[L.headline.none], [L.lead.none, login]];
  if (!spent.length && !over.length && !tight.length) return [[L.headline.allOk(judged.length)], [L.lead.allOk, login]];

  const said = [];
  if (spent.length) said.push(L.headline.spent(listed(spent), spent.length));
  if (over.length) said.push(L.headline.over(listed(over), over.length));
  if (!said.length) said.push(L.headline.tight(listed(tight), tight.length));

  // The window behind each claim: the full one, the one that runs out first, the fullest forecast.
  const detail = [];
  const full = windows.find(({ w }) => w.verdict === 'spent');
  const first = windows.filter(({ w }) => w.runsOutAt).sort((a, b) => a.w.runsOutAt - b.w.runsOutAt)[0];
  const nearest = windows.filter(({ w }) => w.verdict === 'tight').sort((a, b) => (b.w.projectedPct ?? b.w.pct) - (a.w.projectedPct ?? a.w.pct))[0];
  if (full) detail.push(L.lead.full(who(full.p.name), L.windows[full.key], full.w.resetsAt ? when(full.w.resetsAt, now) : ''));
  if (first) detail.push(L.lead.runsOut(who(first.p.name), L.windows[first.key], when(first.w.runsOutAt, now), span(first.w.resetsAt - first.w.runsOutAt)));
  if (!full && !first && nearest) {
    detail.push(nearest.w.projectedPct !== null
      ? L.lead.course(who(nearest.p.name), L.windows[nearest.key], nearest.w.projectedPct, nearest.key)
      : L.lead.level(who(nearest.p.name), L.windows[nearest.key], nearest.w.pct));
  }

  return [[said[0], said[1] ? [', ', said[1]] : [], '.'], [detail, login]];
}

function renderStamp() {
  if (!state.limits) return;

  const minutes = Math.floor((Date.now() - state.limits.fetchedAt) / 60000);
  $('stamp').textContent = `${L.stamp(clock(state.limits.fetchedAt))} · ${L.ago(Math.max(0, minutes))}`;
}

function renderLimits(animate) {
  if (!state.limits) {
    $('headline').textContent = state.limitsFailed ? L.headline.failed : L.reading;
    $('limits-status').textContent = state.limitsFailed ? L.limitsFailed(state.limitsFailed) : '';
    return;
  }

  const { profiles, freest, now } = state.limits;
  const windows = profiles.flatMap((p) => ['fiveHour', 'weekly'].filter((key) => p[key]).map((key) => ({ p, key, w: p[key] })));
  const fullest = windows.reduce((top, each) => (!top || each.w.pct > top.w.pct ? each : top), null);
  const next = windows.filter(({ w }) => w.resetsAt > now && w.pct > 0).sort((a, b) => a.w.resetsAt - b.w.resetsAt)[0];
  const roomy = profiles.find((p) => p.name === freest);

  const [title, lead] = leadOf(profiles, windows, now);
  $('headline').replaceChildren(...[title].flat(Infinity));
  $('lead').replaceChildren(...[lead].flat(Infinity));
  // The tab says how things stand, for when the page is not the one in front.
  document.title = `${$('headline').textContent} — aimux`;

  $('limit-tiles').hidden = false;
  $('limit-tiles').replaceChildren(
    readout(L.mostRoom, roomy ? who(roomy.name) : '—', roomy ? L.levels(roomy.fiveHour?.pct ?? null, roomy.weekly?.pct ?? null) : L.noneReported),
    readout(L.closest, fullest ? [who(fullest.p.name), ` · ${fullest.w.pct}%`] : '—',
      fullest ? L.closestSub(L.windows[fullest.key], fullest.w.resetsAt ? when(fullest.w.resetsAt, now) : '') : ''),
    readout(L.resetsNext, next ? [who(next.p.name), ` · ${when(next.w.resetsAt, now)}`] : '—',
      next ? L.nextSub(L.windows[next.key], next.w.pct) : L.noReset));

  // The levels rise when the page opens or is refreshed, not on every quiet re-read.
  $('subs').classList.toggle('power-on', animate);
  $('subs').replaceChildren(...profiles.map((p, n) => subscriptionCard(p, now, n)));
  $('limits-key').hidden = windows.length === 0;
  $('limits-status').textContent = '';
  renderStamp();
}

// ---------- usage: over time ----------
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const keyDate = (key) => new Date(Number(key.slice(0, 4)), Number(key.slice(5, 7)) - 1, Number(key.slice(8, 10) || 1), Number(key.slice(11, 13) || 0));

/**
 * The chart's columns and how to name them. The report lists every day or hour of its
 * window itself, in the zone they were counted in; a long window is gathered into weeks
 * or months here.
 */
function buckets(usage) {
  const list = usage.buckets;
  if (usage.hourly) {
    return { list, of: (key) => key, name: (key) => `${dayMonth(keyDate(key))}, ${key.slice(11)}:00`, short: (key) => `${key.slice(11)}:00`, unit: 'hour' };
  }

  if (list.length > 370) {
    const of = (key) => key.slice(0, 7);
    return { list: [...new Set(list.map(of))], of, name: (key) => monthYear(keyDate(key)), short: (key) => monthYear(keyDate(key)), unit: 'month' };
  }
  if (list.length > 62) {
    // A week is named by its Monday.
    const of = (key) => {
      const d = keyDate(key);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return dayKey(d);
    };
    return { list: [...new Set(list.map(of))], of, name: (key) => L.weekOf(dayMonth(keyDate(key))), short: (key) => dayMonth(keyDate(key)), unit: 'week' };
  }
  return { list, of: (key) => key, name: (key) => dayMonth(keyDate(key)), short: (key) => dayMonth(keyDate(key)), unit: 'day' };
}

/** The top of an axis of four even, round steps at or above `max`; whole steps for counts. */
function axisTop(max, whole) {
  const raw = Math.max(max, whole ? 4 : 0.04) / 4;
  const pow = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * pow).find((each) => each >= raw * 0.999999 && (!whole || Number.isInteger(each)));

  return step * 4;
}

/** A column segment: square at the baseline, the top one rounded at its data end. */
function segment(x, y, w, h, rounded) {
  const r = rounded ? Math.min(4, w / 2, h) : 0;
  return `M${x} ${y + h}V${y + r}a${r} ${r} 0 0 1 ${r} ${-r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${y + h}z`;
}

function renderTime(animate) {
  const usage = state.usage;
  const measure = MEASURES[state.measure];
  const b = buckets(usage);

  // series -> bucket -> value. Series order is fixed: the config's, then the grey ones.
  const all = [...order.slice(0, 8), OTHERS, UNTIED];
  const values = new Map(all.map((n) => [n, new Map()]));
  for (const d of usage.days) {
    const series = values.get(seriesOf(d.profile));
    const key = b.of(d.day);
    series.set(key, (series.get(key) ?? 0) + measure.of(d));
  }
  const shown = all.filter((n) => [...values.get(n).values()].some((v) => v > 0));
  const totals = b.list.map((key) => shown.reduce((sum, n) => sum + (values.get(n).get(key) ?? 0), 0));

  const title = L.chartTitle(L.measures[state.measure], L.unit[b.unit]);
  $('time-title').textContent = title;
  $('time-legend').replaceChildren(...(shown.length > 1 ? shown : []).map((n) => el('span', { class: 'item' }, el('span', { class: 'swatch', style: `background:${paint(n)}` }), seriesName(n))));

  const host = $('time-chart');
  const max = axisTop(Math.max(...totals, 0), measure.whole);
  const ticks = [0, 1, 2, 3, 4].map((i) => (max / 4) * i);
  // Room on the left for the longest axis label: "$1,5 тыс." is wider than "$1.5K".
  const left = Math.max(44, Math.max(...ticks.map((v) => measure.tick(v).length)) * 6.6 + 14);
  const W = Math.max(320, host.clientWidth);
  const H = 240, right = 8, top = 8, bottom = 24;
  const plotW = W - left - right, plotH = H - top - bottom;
  const band = plotW / b.list.length;
  const colW = Math.max(1, Math.min(24, band - 2));
  const y = (v) => top + plotH - (v / max) * plotH;

  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', tabindex: 0, 'aria-label': L.chartLabel(title) });
  ticks.forEach((v, i) => {
    svg.append(
      s('line', { x1: left, x2: W - right, y1: y(v), y2: y(v), stroke: i ? 'var(--grid)' : 'var(--axis)', 'stroke-width': 1 }),
      s('text', { x: left - 8, y: y(v) + 4, 'text-anchor': 'end', text: measure.tick(v) }));
  });

  const every = Math.ceil(b.list.length / Math.max(2, Math.floor(plotW / 76)));
  const wash = s('rect', { y: top, width: band, height: plotH, fill: 'var(--wash)', visibility: 'hidden' });
  const cols = s('g', { class: animate ? 'cols grow' : 'cols' });
  svg.append(wash, cols);

  b.list.forEach((key, i) => {
    const cx = left + band * i + band / 2;
    if (i % every === 0) svg.append(s('text', { x: cx, y: H - 6, 'text-anchor': 'middle', text: b.short(key) }));

    const parts = shown.map((n) => [n, values.get(n).get(key) ?? 0]).filter(([, v]) => v > 0);
    let base = 0;
    parts.forEach(([n, v], at) => {
      const y0 = y(base + v);
      const h = y(base) - y0;
      const gap = at > 0 && h > 3 ? 2 : 0; // surface showing between touching segments
      cols.append(s('path', { d: segment(cx - colW / 2, y0, colW, Math.max(0.5, h - gap), at === parts.length - 1), fill: paint(n) }));
      base += v;
    });
  });

  const readout = (i) => {
    const key = b.list[i];
    const rows = shown.map((n) => [n, values.get(n).get(key) ?? 0]).filter(([, v]) => v > 0).map(([n, v]) => [measure.show(v), seriesName(n), paint(n)]);

    return [b.name(key), rows.length === 1 ? rows : [...rows, [measure.show(totals[i]), L.total]]];
  };
  let active = -1;
  const point = (i, x, yPos) => {
    active = i;
    wash.setAttribute('x', left + band * i);
    wash.setAttribute('visibility', 'visible');
    showTip(x, yPos, ...readout(i));
  };
  const leave = () => { active = -1; wash.setAttribute('visibility', 'hidden'); hideTip(); };

  svg.addEventListener('pointermove', (e) => {
    const box = svg.getBoundingClientRect();
    const i = Math.floor(((e.clientX - box.left) * (W / box.width) - left) / band);
    if (i >= 0 && i < b.list.length) point(i, e.clientX, e.clientY);
    else leave();
  });
  svg.addEventListener('pointerleave', leave);
  svg.addEventListener('blur', leave);
  svg.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') return leave();
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();

    const i = Math.max(0, Math.min(b.list.length - 1, active < 0 ? b.list.length - 1 : active + (e.key === 'ArrowRight' ? 1 : -1)));
    const box = svg.getBoundingClientRect();
    point(i, box.left + ((left + band * (i + 0.5)) / W) * box.width, box.top + box.height / 2);
  });
  host.replaceChildren(svg);

  $('time-table').replaceChildren(el('table', {},
    el('thead', {}, el('tr', {}, el('th', { text: L.unitHead[b.unit] }), ...shown.map((n) => el('th', { text: seriesName(n) })), el('th', { text: L.Total }))),
    el('tbody', {}, ...b.list.map((key, i) => [key, i]).reverse().map(([key, i]) => el('tr', {},
      el('td', { text: b.name(key) }),
      ...shown.map((n) => el('td', { text: measure.show(values.get(n).get(key) ?? 0) })),
      el('td', { text: measure.show(totals[i]) }))))));
}

// ---------- usage: tables and bar lists ----------
const sum = (rows) => rows.reduce((total, r) => {
  for (const key of ['requests', 'inputTokens', 'cacheCreationInputTokens', 'cacheReadInputTokens', 'outputTokens', 'estimatedCostUsd']) total[key] += r[key];
  return total;
}, { requests: 0, inputTokens: 0, cacheCreationInputTokens: 0, cacheReadInputTokens: 0, outputTokens: 0, estimatedCostUsd: 0 });

function numberCells(row) {
  return [row.requests, row.inputTokens, row.cacheCreationInputTokens, row.cacheReadInputTokens, row.outputTokens]
    .map((n) => el('td', { text: compact(n), title: whole(n) }))
    .concat(el('td', { text: usd(row.estimatedCostUsd) }));
}

function renderProfiles() {
  const measure = MEASURES[state.measure];
  const rows = [...state.usage.profiles].sort((a, b) => Number(isUnknown(a.profile)) - Number(isUnknown(b.profile)) || measure.of(b) - measure.of(a));
  const total = sum(rows);

  $('profile-table').replaceChildren(el('table', {},
    el('thead', {}, el('tr', {}, ...L.profileHeads.map((h) => el('th', { text: h })))),
    el('tbody', {}, ...rows.map((r) => el('tr', {},
      el('td', {}, el('span', { class: 'dot', style: `background:${colorOf(r.profile)}` }), r.profile),
      el('td', { text: whole(r.sessions) }),
      ...numberCells(r)))),
    el('tfoot', {}, el('tr', {}, el('td', { text: L.Total }), el('td', { text: whole(rows.reduce((n, r) => n + r.sessions, 0)) }), ...numberCells(total)))));

  const all = tokensOf(total);
  const share = (n) => (all ? `${Math.round((n / all) * 100)}%` : '0%');
  $('usage-tiles').replaceChildren(
    readout(L.costTile, usd(total.estimatedCostUsd), L.costSub),
    readout(L.measures.requests, compact(total.requests), L.requestsSub(whole(total.requests))),
    readout(L.measures.tokens, compact(all), L.tokensSub(share(total.cacheReadInputTokens), share(total.cacheCreationInputTokens), share(total.inputTokens), share(total.outputTokens))));
}

function barList(host, rows, nameOf, fullName) {
  const measure = MEASURES[state.measure];
  const sorted = [...rows].sort((a, b) => measure.of(b) - measure.of(a)).slice(0, 10).filter((r) => measure.of(r) > 0);
  const max = Math.max(...sorted.map(measure.of), 0);

  host.replaceChildren(...(sorted.length ? sorted : [null]).map((r) => {
    if (!r) return el('p', { class: 'status', text: L.nothing });

    return withTip(el('div', { class: 'bar-row', tabindex: 0 },
      el('span', { class: 'name', text: nameOf(r) }),
      el('span', { class: 'track' }, el('span', { class: 'rod', style: `width:calc((100% - 84px) * ${measure.of(r) / max})` }), el('span', { class: 'val', text: measure.show(measure.of(r)) }))),
    () => [fullName(r), [[usd(r.estimatedCostUsd), L.tipRows[0]], [compact(tokensOf(r)), L.tipRows[1]], [whole(r.requests), L.tipRows[2]]]]);
  }));
}

/** A long name keeps both its ends: the end is what tells one project or model from the next. */
const mid = (text, max = 34) => (text.length > max ? `${text.slice(0, Math.floor(max / 2) - 1)}…${text.slice(-Math.ceil(max / 2))}` : text);
const shortPath = (path) => mid(path.split('/').filter(Boolean).slice(-2).join('/') || path);

function renderLists() {
  const measure = MEASURES[state.measure];
  $('models-title').textContent = L.byModel(L.measures[state.measure]);
  $('projects-title').textContent = L.byProject(L.measures[state.measure]);
  barList($('models'), state.usage.models, (r) => mid(r.model), (r) => r.model);
  barList($('projects'), state.usage.projects, (r) => shortPath(r.project), (r) => r.project);

  const rows = [...state.usage.sessions].sort((a, b) => measure.of(b) - measure.of(a)).slice(0, 12);
  $('sessions').replaceChildren(el('table', {},
    el('thead', {}, el('tr', {}, ...L.sessionHeads.map((h, i) => el('th', { text: h, class: i < 3 && 'text' })))),
    el('tbody', {}, ...rows.map((r) => el('tr', {},
      el('td', { title: r.sessionId }, el('code', { text: r.sessionId.slice(0, 8) })),
      el('td', { class: 'text' }, el('span', { class: 'dot', style: `background:${colorOf(r.profile)}` }), r.profile),
      el('td', { class: 'text', text: shortPath(r.project), title: r.project }),
      el('td', { text: whole(r.requests) }),
      el('td', { text: compact(tokensOf(r)), title: whole(tokensOf(r)) }),
      el('td', { text: usd(r.estimatedCostUsd) }))))));
}

/** `animate`: the columns grow in — when the reader changed what is shown, not on a quiet re-read. */
function renderUsage(animate = false) {
  if (!state.usage) return;
  renderProfiles();
  renderTime(animate);
  renderLists();
  $('usage-status').textContent = L.usageRead(clock(state.usage.computedAt));
}

// ---------- loading ----------
// The key to the figures. The server puts it in the page it serves to an address with a
// ticket; it is kept for this tab (a reload has no ticket), and the ticket leaves the address.
const KEY = (() => {
  const slot = document.querySelector('meta[name="aimux-key"]');
  const given = slot.content;
  slot.remove();

  try {
    if (given) sessionStorage.setItem('aimux.key', given);

    const address = new URL(location.href);
    if (address.searchParams.has('t')) {
      address.searchParams.delete('t');
      history.replaceState(null, '', address);
    }
    return given || sessionStorage.getItem('aimux.key') || '';
  } catch {
    return given; // no storage in this window: the key lasts until a reload
  }
})();

async function getJson(path) {
  const response = await fetch(path, { headers: { 'x-aimux-key': KEY } });
  const body = await response.json();
  if (response.status === 403) throw new Error(L.noKey);
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}

let limitsAsked = 0;
let limitsLoadedAt = 0;
/** `animate`: the reader asked for this reading (the page opening, Refresh), so the levels rise. */
async function loadLimits(fresh, animate) {
  const mine = ++limitsAsked;

  try {
    const [limits, history] = await Promise.all([getJson(`/api/limits${fresh ? '?fresh=1' : ''}`), getJson('/api/history?hours=168')]);
    if (mine !== limitsAsked) return; // a later reading was asked for meanwhile

    state.limits = limits;
    state.history = history;
    state.limitsFailed = null;
    limitsLoadedAt = Date.now();
    // Colours follow the config's order of profiles, so a profile keeps its colour.
    if (order.join() !== limits.order.join()) {
      order = limits.order;
      renderUsage();
    }
    renderLimits(animate);
    $('limits-status').classList.remove('bad');
  } catch (err) {
    if (mine !== limitsAsked) return;

    state.limitsFailed = err.message;
    if (!state.limits) $('headline').textContent = L.headline.failed;
    $('limits-status').textContent = L.limitsFailed(err.message);
    $('limits-status').classList.add('bad');
  }
}

let asked = 0;
let usageLoadedAt = 0;
let usageFailed = null;
async function loadUsage(animate) {
  const mine = ++asked;
  const status = $('usage-status');
  $('usage').classList.add('stale');
  if (state.usage) status.textContent = L.readingUsage;

  try {
    const usage = await getJson(`/api/usage?since=${state.since}`);
    if (mine !== asked) return; // a newer period was picked meanwhile

    state.usage = usage;
    usageFailed = null;
    usageLoadedAt = Date.now();
    // Before the limits answer there is no config order yet: by name, never by rank.
    if (!order.length) order = usage.profiles.map((p) => p.profile).filter((n) => !isUnknown(n)).sort();
    $('usage').hidden = false;
    renderUsage(animate);
    status.classList.remove('bad');
  } catch (err) {
    if (mine !== asked) return;

    usageFailed = err.message;
    status.textContent = L.usageFailed(err.message);
    status.classList.add('bad');
  } finally {
    if (mine === asked) $('usage').classList.remove('stale');
  }
}

// ---------- controls ----------
function segmented(host, name, options, current, onPick) {
  host.replaceChildren(...options.flatMap(([id, label]) => [
    el('input', { type: 'radio', name, id: `${name}-${id}`, value: id, checked: id === current, onchange: () => onPick(id) }),
    el('label', { for: `${name}-${id}`, text: label }),
  ]));
}

/** Everything on the page that is words: said again in the language just chosen. */
function applyLanguage() {
  L = LANGS[lang];
  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = L[node.dataset.t];
  $('notes').replaceChildren(...L.notes.map((note) => el('p', {}, rich(note))));
  $('theme').setAttribute('aria-label', document.documentElement.dataset.theme === 'dark' ? L.themeToLight : L.themeToDark);
  $('theme').title = $('theme').getAttribute('aria-label');

  segmented($('since'), 'since', PERIODS.map((id) => [id, L.periods[id]]), state.since, (id) => { state.since = id; remember('since', id); loadUsage(true); });
  segmented($('measure'), 'measure', Object.keys(MEASURES).map((id) => [id, L.measures[id]]), state.measure, (id) => { state.measure = id; remember('measure', id); renderUsage(true); });

  renderLimits(false);
  if (state.usage) renderUsage(false);
  else $('usage-status').textContent = usageFailed ? L.usageFailed(usageFailed) : L.scanning;
}

segmented($('lang'), 'lang', [['en', 'EN'], ['ru', 'RU']], lang, (id) => { lang = id; remember('lang', id); applyLanguage(); });
$('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  remember('theme', next);
  applyLanguage();
});
$('refresh').addEventListener('click', async () => {
  $('refresh').disabled = true;
  await Promise.allSettled([loadLimits(true, true), loadUsage(true)]);
  $('refresh').disabled = false;
});

let resizing;
addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(() => state.usage && renderTime(false), 120); });

// A tab nobody is looking at asks for nothing; on coming back it catches up at once.
const LIMITS_EVERY = 60_000;
const USAGE_EVERY = 5 * 60_000;
function catchUp() {
  if (document.hidden) return;
  if (Date.now() - limitsLoadedAt >= LIMITS_EVERY) loadLimits(false, false);
  if (Date.now() - usageLoadedAt >= USAGE_EVERY) loadUsage(false);
  renderStamp();
}
document.addEventListener('visibilitychange', catchUp);
setInterval(catchUp, 20_000);

applyLanguage();
loadLimits(false, true);
loadUsage(true);
</script>
</body>
</html>
